# HPE G8 Fan Controller Configuration
# HP DL360p Gen8 with modded iLO4 firmware
# Calibrated: 2026-07-01 — Summer baseline (Hitzewelle peak 2026-06-29)
# Strategy: global max-wins, all fans move together, smooth ramp ±3%/1% per cycle
# Data source: InfluxDB 7-day stats (mean + peak)
#
# Sensor baselines (7d mean → peak):
#   Inlet Ambient:  32°C → 38°C
#   CPU 1/2:        40°C → 45/46°C
#   Chipset 1:      53°C → 60°C
#   VR P1/P2:       46/48°C → 58/57°C
#   HD Controller:  68°C → 78°C
#   LOM Card:       69°C → 76°C
#   Sys Exhaust:    43-47°C → 49-54°C

ilo:
  host: "10.11.12.13"
  username: "Administrator"
  password: ""  # Set via env ILO_PASSWORD or /etc/fan-controller/env
  ssh_kex: "diffie-hellman-group14-sha1"

interval: 15

# 33% summer baseline (up from 28% winter)
min_fan_percent: 33

# Ramp rate limiting — smooth transitions, reduces noise
# All fans move together to global_speed = max(all sensor curves)
ramp:
  up_per_cycle: 2      # max +2% per 15s cycle when heating up
  down_per_cycle: 2    # max -2% per 15s cycle when cooling down
  tolerance_pct: 5     # fan blocks allowed ±5% from global target (Fan Mod)

sensors:
  # --- AMBIENT: Inlet drives global baseline ---
  inlet:
    name: "01-Inlet Ambient"
    source: "ipmi"
    critical_temp: 45
    # Mean 32°C, Peak 38°C — curves shifted up for summer home environment
    fan_curve:
      - [22, 33]
      - [28, 36]
      - [32, 40]
      - [35, 44]
      - [37, 48]
      - [38, 52]
      - [40, 58]
      - [43, 70]
      - [45, 100]

  # --- PRIMARY: HD Controller (structurally hottest, mean 68°C) ---
  hd_controller:
    name: "31-HD Controller"
    source: "ipmi"
    critical_temp: 100
    # Mean 68°C, Peak 78°C — react earlier, smoother climb
    fan_curve:
      - [50, 33]
      - [58, 36]
      - [63, 40]
      - [68, 46]
      - [72, 52]
      - [76, 58]
      - [82, 68]
      - [90, 85]
      - [96, 100]

  # --- PRIMARY: LOM Card (mean 69°C, peak 76°C) ---
  lom_card:
    name: "35-LOM Card"
    source: "ipmi"
    critical_temp: 90
    fan_curve:
      - [45, 33]
      - [56, 36]
      - [62, 40]
      - [67, 46]
      - [71, 52]
      - [75, 58]
      - [80, 68]
      - [85, 85]
      - [88, 100]

  # --- SECONDARY: CPUs (mean 40°C, peak 46°C — relaxed) ---
  cpu1:
    name: "coretemp-isa-0000"
    source: "sensors"
    critical_temp: 90
    fan_curve:
      - [35, 33]
      - [42, 36]
      - [50, 40]
      - [58, 46]
      - [65, 52]
      - [72, 58]
      - [80, 70]
      - [85, 85]
      - [89, 100]

  cpu2:
    name: "coretemp-isa-0001"
    source: "sensors"
    critical_temp: 90
    fan_curve:
      - [35, 33]
      - [42, 36]
      - [50, 40]
      - [58, 46]
      - [65, 52]
      - [72, 58]
      - [80, 70]
      - [85, 85]
      - [89, 100]

  # --- SECONDARY: Chipset (mean 53°C, peak 60°C) ---
  chipset:
    name: "13-Chipset 1"
    source: "ipmi"
    critical_temp: 95
    fan_curve:
      - [38, 33]
      - [46, 36]
      - [52, 40]
      - [56, 44]
      - [59, 50]
      - [62, 56]
      - [70, 65]
      - [82, 80]
      - [92, 100]

# Outdoor temperature (Open-Meteo, Basel) — direct curve input + boost
outdoor:
  enabled: true
  latitude: 47.5596
  longitude: 7.5886
  poll_interval: 600

  # Outdoor temp fan curve — contributes to global max-wins calculation
  # Home environment without rack: outdoor temp directly affects inlet
  fan_curve:
    - [15, 33]
    - [20, 35]
    - [25, 38]
    - [28, 42]
    - [30, 46]
    - [33, 52]
    - [35, 58]
    - [38, 65]
    - [40, 75]

  # Additional boost on top of curve when both outdoor AND sensors are elevated
  boost_outdoor_temp: 30
  boost_sensor_thresholds:
    hd_controller: 74
    lom_card: 72
  boost_percent: 3

# Adaptive cooling detection (AC = can run quieter)
adaptive:
  enabled: true
  history_window: 3600
  correlation_threshold: 0.7
  discount_percent: 4

# Escalation: temps still rising after 3min despite fan speed
escalation:
  enabled: true
  window_seconds: 180
  step_percent: 8
  max_percent: 100

log_level: "INFO"
log_file: "/var/log/fan-controller.log"

max_read_failures: 3
failsafe_percent: 80
