# HPE G8 Fan Controller Configuration
# HP DL360p Gen8 with modded iLO4 + Fan Mod firmware
# Calibrated: 2026-07-01 — Summer baseline (Hitzewelle peak 2026-06-29)
# Strategy: global max-wins, all fans move together, smooth ramp ±2%/cycle
#
# Profile system:
#   mode: calendar  → switches by astronomical seasons (Mar20/Jun21/Sep23/Dec21)
#   mode: auto      → switches by outdoor temperature thresholds
#   mode: manual    → use --profile <name> CLI arg or profile: fixed below
#
# Sensor baselines (7d mean → peak, 2026-06-24 to 2026-07-01):
#   Inlet Ambient:  32°C → 38°C
#   CPU 1/2:        40°C → 45/46°C
#   Chipset 1:      53°C → 60°C
#   VR P1/P2:       46/48°C → 58/57°C
#   HD Controller:  68°C → 78°C
#   LOM Card:       69°C → 76°C

ilo:
  host: "10.11.12.13"
  username: "Administrator"
  password: ""  # Set via env ILO_PASSWORD or /etc/fan-controller/env
  ssh_kex: "diffie-hellman-group14-sha1"

interval: 15

# Profile selection mode: calendar | auto | manual
profile_mode: calendar

# Manual override — only used when profile_mode: manual
# profile: summer

# Auto mode: switch profile based on outdoor temperature
auto_profile:
  winter_below: 8
  spring_below: 18
  summer_above: 24
  # between spring_below and summer_above = spring or autumn (by calendar half-year)

# Ramp rate (shared across all profiles — Fan Mod gives full control)
ramp:
  up_per_cycle: 2    # max +2% per 15s cycle
  down_per_cycle: 2  # max -2% per 15s cycle
  tolerance_pct: 5   # fan blocks allowed ±5% from global target

