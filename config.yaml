# Outdoor temperature source (Open-Meteo, Basel)
outdoor:
  enabled: true
  latitude: 47.5596
  longitude: 7.5886
  poll_interval: 600
  # Boost: outdoor AND sensors both elevated
  boost_outdoor_temp: 30
  boost_sensor_thresholds:
    hd_controller: 74
    lom_card: 72
  boost_percent: 3

# Adaptive cooling detection (AC = can run quieter)
adaptive:
  enabled: true
  history_window: 3600
  correlation_threshold: 0.7
  discount_percent: 4

# Escalation: temps still rising after 3min despite fan speed
escalation:
  enabled: true
  window_seconds: 180
  step_percent: 8
  max_percent: 100

log_level: "INFO"
log_file: "/var/log/fan-controller.log"

max_read_failures: 3
failsafe_percent: 80
